<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('sea'),ctx=canvas.getContext('2d');

let coins=valid(saved.coins,5000),score=valid(saved.score,0),caught=valid(saved.caught,0),level=Math.min(10,Math.max(1,Math.floor(valid(saved.level,1)))),best=valid(saved.best,0);

function resize(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;const d=Math.min(devicePixelRatio||1,2);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);aim={x:W/2,y:H*.4}}

function toast(s){$('toast').textContent=s;$('toast').style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.opacity=0,1800)}
function hud(){ $('coins').textContent=Math.floor(coins).toLocaleString();$('score').textContent=score.toLocaleString();$('level').textContent=level;$('caught').textContent=caught+' 尾';$('best').textContent=best.toLocaleString();$('task').value=caught%10;$('tasktext').textContent=(caught%10)+' / 10 · 奖励 300 金币';$('power').textContent='×'+powers[mult];$('upgrade').textContent=level===10?'已满级':'升级 '+level*500;$('upgrade').disabled=level===10;$('next').textContent=fish.some(f=>f.kind===4)?'挑战进行中':Math.max(0,Math.ceil(bossAt-t))+' 秒'}
function spawn(kind){const k=kind??(Math.random()<.08?3:Math.floor(Math.random()*3)),def=types[k],right=Math.random()>.5;fish.push({kind:k,x:k===4?W/2:right?-80:W+80,y:130+Math.random()*Math.max(40,H-300),base:Math.random()*6,dir:right?1:-1,hp:def.hp,max:def.hp,hit:0})}
for(let i=0;i<14;i++){spawn();fish[i].x=Math.random()*1000}
function fire(){if(paused||t-shotAt<(t<rageUntil?.09:.23))return;const cost=powers[mult];if(coins<cost){auto=false;$('auto').textContent='自动开炮 · 关';$('auto').classList.remove('active');toast('金币不足：降低倍率或领取补给');if(coins<1){coins=300;toast('补给已送达：300 金币')}hud();return}shotAt=t;coins-=cost;const origin={x:W/2,y:H-72};let target=aim;if(lock&&fish.length)target=fish.reduce((a,b)=>a.kind>b.kind?a:b);const angle=Math.atan2(target.y-origin.y,target.x-origin.x);bullets.push({x:origin.x,y:origin.y,vx:Math.cos(angle)*600,vy:Math.sin(angle)*600,damage:cost*(1+(level-1)*.2)*(t<rageUntil?2:1),life:2});hud()}
function capture(f){const reward=types[f.kind].reward;coins+=reward;score+=reward;caught++;best=Math.max(best,score);if(caught%10===0){coins+=300;toast('任务完成！额外获得 300 金币')}particles.push({x:f.x,y:f.y,text:'+'+reward,life:1.3});ripples.push({x:f.x,y:f.y,life:.5});for(let i=0;i<12;i++)particles.push({x:f.x,y:f.y,vx:(Math.random()-.5)*150,vy:(Math.random()-.5)*150,life:.6});fish.splice(fish.indexOf(f),1);if(f.kind===4){bossAt=t+60;toast('黄金鲨王已捕获！+2500 金币')}hud();save()}
function drawFish(f){const a=types[f.kind],s=a.size;
if(ready(artKeys[f.kind])){
 const im=art[artKeys[f.kind]],w=s*3.2,h=w*im.naturalHeight/im.naturalWidth;
 ctx.save();ctx.translate(f.x,f.y);ctx.scale(f.dir,1);ctx.rotate(Math.sin(t*2+f.base)*.065);
 ctx.scale(1+.025*Math.sin(t*6+f.base),1);ctx.shadowColor=f.kind>=3?'#ffd663':'#00111e';ctx.shadowBlur=f.kind>=3?12:5;
 if(f.hit>t)ctx.filter='brightness(1.7)';

 if(lock&&fish.reduce((a,b)=>a.kind>b.kind?a:b)===f){ctx.strokeStyle='#ffe6a1';ctx.lineWidth=1.5;ctx.setLineDash([5,5]);ctx.beginPath();ctx.ellipse(f.x,f.y,s*1.7,s,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}
 if(f.hp<f.max){ctx.fillStyle='#001b29aa';ctx.fillRect(f.x-s,f.y-h/2-10,s*2,4);ctx.fillStyle='#ffdc79';ctx.fillRect(f.x-s,f.y-h/2-10,s*2*f.hp/f.max,4)}return;
}ctx.save();ctx.translate(f.x,f.y);ctx.scale(f.dir,1);ctx.rotate(Math.sin(t*2+f.base)*.08);ctx.shadowColor=a.color;ctx.shadowBlur=f.hit>t?25:6;ctx.fillStyle=f.hit>t?'#fff':a.color;
ctx.beginPath();ctx.moveTo(-s*.75,0);ctx.lineTo(-s*1.55,-s*.65);ctx.quadraticCurveTo(-s*1.2,0,-s*1.55,s*.65);ctx.closePath();ctx.fill();
const g=ctx.createLinearGradient(0,-s,0,s);g.addColorStop(0,'#f0ffff');g.addColorStop(.35,a.color);g.addColorStop(1,'#173e57');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,s,s*.57,0,0,7);ctx.fill();
ctx.fillStyle=a.color;ctx.beginPath();ctx.moveTo(-s*.2,-s*.4);ctx.lineTo(s*.1,-s*.95);ctx.lineTo(s*.5,-s*.4);ctx.fill();
if(f.kind===0){ctx.strokeStyle='#fff5d2';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-s*.3,-s*.45);ctx.lineTo(-s*.3,s*.45);ctx.stroke()}
if(f.kind===2){for(let i=0;i<10;i++){const an=i/10*Math.PI*2;ctx.beginPath();ctx.moveTo(Math.cos(an)*s,Math.sin(an)*s*.6);ctx.lineTo(Math.cos(an)*(s+6),Math.sin(an)*(s*.6+6));ctx.strokeStyle='#e8d69e';ctx.stroke()}}
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s*.55,-s*.12,s*.15,0,7);ctx.fill();ctx.fillStyle='#061824';ctx.beginPath();ctx.arc(s*.61,-s*.12,s*.08,0,7);ctx.fill();
if(f.kind===4){ctx.fillStyle='#ffe196';ctx.beginPath();ctx.moveTo(-25,-45);ctx.lineTo(-30,-70);ctx.lineTo(-10,-58);ctx.lineTo(0,-80);ctx.lineTo(12,-58);ctx.lineTo(30,-70);ctx.lineTo(24,-45);ctx.fill();ctx.strokeStyle='#673b1e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(20,15);ctx.lineTo(60,12);ctx.stroke()}
ctx.restore();if(f.hp<f.max){ctx.fillStyle='#001b29';ctx.fillRect(f.x-s,f.y-s-12,s*2,4);ctx.fillStyle='#65f1cf';ctx.fillRect(f.x-s,f.y-s-12,s*2*f.hp/f.max,4)}}
function background(){
if(ready('background')){
 const im=art.background,scale=Math.max(W/im.naturalWidth,H/im.naturalHeight),dw=im.naturalWidth*scale,dh=im.naturalHeight*scale;
 sprite(im,(W-dw)/2,(H-dh)/2,dw,dh);
 ctx.fillStyle='#00223533';ctx.fillRect(0,0,W,H);
 for(let i=0;i<30;i++){const bx=(i*113.7)%W,by=H-(t*(8+i%4)+i*41)%H;ctx.strokeStyle='#c4ffff35';ctx.lineWidth=.8;ctx.beginPath();ctx.arc(bx,by,1+i%3,0,7);ctx.stroke()}
 return;
}
let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#087184');g.addColorStop(.45,'#06465d');g.addColorStop(1,'#031e30');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(let i=0;i<6;i++){ctx.fillStyle='#77dfe208';ctx.beginPath();ctx.moveTo(W*.35+i*55,-10);ctx.lineTo(W*.1+i*160,H);ctx.lineTo(W*.3+i*160,H);ctx.closePath();ctx.fill()}
for(let i=0;i<42;i++){const x=(i*113.7)%W,y=(H-(t*12+i*41)%H);ctx.strokeStyle='#9be7ef28';ctx.beginPath();ctx.arc(x,y,2+i%4,0,7);ctx.stroke()}
ctx.fillStyle='#052638';ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=20)ctx.lineTo(x,H-35-Math.sin(x/120)*18);ctx.lineTo(W,H);ctx.fill();
for(let i=0;i<32;i++){const x=i*W/31;ctx.strokeStyle=['#21666a','#267688','#654d7c','#95677c'][i%4];ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,H);ctx.quadraticCurveTo(x-12,H-35,x+Math.sin(t+i)*8,H-35-i%5*10);ctx.stroke()}}
function frame(now){const dt=Math.min(.035,(now-last)/1000||0);last=now;if(!paused){t+=dt;if(t>spawnAt&&fish.length<26){spawn();spawnAt=t+.7}if(t>bossAt&&!fish.some(f=>f.kind===4))spawn(4);if(auto||holding)fire();
for(const f of [...fish]){if(t>=frozenUntil)f.x+=f.dir*types[f.kind].speed*dt*(f.kind===4&&f.hp<160?1.5:1);f.y+=Math.sin(t+f.base)*dt*8;if(f.kind===4){if(f.x>W-80||f.x<80)f.dir*=-1}else if(f.x>W+100||f.x<-100)fish.splice(fish.indexOf(f),1)}

}else{ctx.fillStyle='#efc56b';ctx.fillRect(-12,-65,24,58)}

$('fire').onclick=fire;$('minus').onclick=()=>{mult=Math.max(0,mult-1);hud()};$('plus').onclick=()=>{mult=Math.min(4,mult+1);hud()};
$('auto').onclick=()=>{auto=!auto;$('auto').classList.toggle('active',auto);$('auto').textContent='自动开炮 · '+(auto?'开':'关')};$('lock').onclick=()=>{lock=!lock;$('lock').classList.toggle('active',lock)};
$('freeze').onclick=()=>{if(paused||t<freezeReady)return;frozenUntil=t+5;freezeReady=t+25;toast('冰冻海域 · 5 秒')};$('rage').onclick=()=>{if(paused||t<rageReady)return;rageUntil=t+6;rageReady=t+30;toast('狂暴射击 · 6 秒')};
$('upgrade').onclick=()=>{if(level>=10)return;if(coins<level*500){toast('升级所需金币不足');return}coins-=level*500;level++;hud();save();toast('炮台升级！伤害提升 20%')};
function setPause(v){paused=v;holding=false;$('pause').textContent=v?'继续':'暂停'}
$('pause').onclick=()=>setPause(!paused);
window.onkeydown=e=>{if(e.target.tagName==='BUTTON'||$('modal').open)return;if(e.code==='Space'){e.preventDefault();fire()}if(e.code==='KeyP')setPause(!paused)};
let wasPaused=false;function modal(title,body){wasPaused=paused;setPause(true);$('mt').textContent=title;$('mb').innerHTML=body;$('modal').showModal()}
$('close').onclick=()=>$('modal').close();$('modal').onclose=()=>setPause(wasPaused);
$('catalog').onclick=()=>modal('海洋图鉴','<div class="catalog">'+types.map((d,i)=>'<div class="entry">'+(ready(artKeys[i])?'<img alt="'+d.name+'" src="'+art[artKeys[i]].src+'">':'')+'<b style="color:'+d.color+'">'+d.name+'</b>生命 '+d.hp+' · 奖励 '+d.reward+'</div>').join('')+'</div>');
$('help').onclick=()=>modal('出航指南','<p>移动鼠标或手指瞄准，按住海面连续开炮。每发消耗对应倍率的金币，倍率同时提升伤害。</p><p>锁定优先瞄准高价值鱼；冰冻持续 5 秒、冷却 25 秒；狂暴持续 6 秒、冷却 30 秒。每捕获 10 条鱼奖励 300 金币。45 秒后黄金鲨王登场。</p><p>升级炮台永久提升基础伤害，最高 10 级。金币、等级和最高分自动保存在本浏览器。清理浏览器数据会删除存档。</p>');
setInterval(save,5000);window.addEventListener('pagehide',save);hud();requestAnimationFrame(frame);
</script></body></html>
